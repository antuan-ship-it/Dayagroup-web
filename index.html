<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Daya Group - Global Freight Forwarding, Customs Brokerage & Integrated Sourcing. PSA BDP Ecosystem Partner.">
    <title>Daya Group | Global Logistics & International Sourcing</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === CSS VARIABLES === */
        :root {
            --bg-dark: #030712;
            --bg-surface: #0F172A;
            --bg-surface-light: #1E293B;
            --primary: #0284C7;
            --primary-hover: #0369A1;
            --accent-cyan: #38BDF8;
            --accent-green: #10B981;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-glass: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(15, 23, 42, 0.7);
            --header-height: 80px;
        }

        /* === RESET & BASE === */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: auto; /* Handled by JS */ overflow-x: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* === TYPOGRAPHY === */
        h1, h2, h3, h4, h5, h6, .logo { font-family: 'Space Grotesk', sans-serif; }
        .section-title { font-size: clamp(28px, 5vw, 42px); font-weight: 800; color: #FFF; margin-bottom: 15px; letter-spacing: -0.5px; }
        .section-subtitle { font-size: clamp(16px, 2vw, 18px); color: var(--text-muted); max-width: 700px; margin-bottom: 50px; }

        /* === HEADER & NAVIGATION === */
        header { position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height); background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-glass); z-index: 9999; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; transition: all 0.3s ease; }
        .logo { font-size: 24px; font-weight: 800; color: #FFF; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent-cyan); }
        
        /* Desktop Nav */
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 14px; transition: color 0.2s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-cyan); }
        
        /* Mobile Menu Button */
        .menu-btn { display: none; font-size: 24px; color: #FFF; background: none; border: none; cursor: pointer; }
        
        @media (max-width: 992px) {
            .nav-links { position: fixed; top: var(--header-height); left: -100%; width: 100%; height: calc(100vh - var(--header-height)); background: var(--bg-dark); flex-direction: column; padding: 40px 5%; transition: 0.4s ease; border-top: 1px solid var(--border-glass); }
            .nav-links.active { left: 0; }
            .nav-links a { font-size: 20px; width: 100%; padding: 15px 0; border-bottom: 1px solid var(--border-glass); }
            .menu-btn { display: block; }
            .header-cta { display: none; }
        }

        /* === BUTTONS === */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 32px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: none; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #00529B); color: #FFF; box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(2, 132, 199, 0.5); }
        .btn-outline { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.2); color: #FFF; backdrop-filter: blur(5px); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #FFF; }
        .btn-accent { background: var(--accent-green); color: var(--bg-dark); }
        .btn-accent:hover { background: #059669; color: #FFF; }

        /* === HERO SECTION === */
        .hero { min-height: 100vh; padding: calc(var(--header-height) + 60px) 5% 80px; display: flex; align-items: center; background: linear-gradient(180deg, rgba(3, 7, 18, 0.8), rgba(3, 7, 18, 1)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat fixed; position: relative; }
        .hero-content { max-width: 900px; z-index: 2; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 8px 18px; border-radius: 30px; font-size: 12px; font-weight: 700; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .hero h1 { font-size: clamp(36px, 6vw, 64px); line-height: 1.1; margin-bottom: 25px; background: linear-gradient(to right, #FFF, #94A3B8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: clamp(16px, 2.5vw, 20px); color: var(--text-muted); margin-bottom: 40px; max-width: 800px; font-weight: 400; }
        .hero-actions { display: flex; gap: 20px; flex-wrap: wrap; }

        /* === STATS TICKER === */
        .stats-container { background: var(--bg-surface); border-top: 1px solid var(--border-glass); border-bottom: 1px solid var(--border-glass); padding: 40px 5%; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; text-align: center; }
        .stat-item h3 { font-size: clamp(32px, 5vw, 48px); color: var(--accent-cyan); margin-bottom: 5px; }
        .stat-item p { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1.5px; }

        /* === LAYOUT SECTIONS === */
        .section { padding: 100px 5%; border-bottom: 1px solid var(--border-glass); position: relative; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; gap: 40px; } }

        /* === SERVICES CARDS === */
        .service-card { background: var(--bg-surface); border: 1px solid var(--border-glass); border-radius: 16px; padding: 40px; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s; position: relative; overflow: hidden; }
        .service-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); transform: scaleX(0); transform-origin: left; transition: transform 0.4s; }
        .service-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .service-card:hover::before { transform: scaleX(1); }
        .icon-box { width: 64px; height: 64px; background: rgba(2, 132, 199, 0.1); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--accent-cyan); margin-bottom: 25px; }
        .service-card h3 { font-size: 24px; margin-bottom: 15px; }
        .service-card p { color: var(--text-muted); margin-bottom: 30px; }
        
        /* === COMMODITIES / INDUSTRIES === */
        .product-card { background: var(--bg-surface); border-radius: 16px; overflow: hidden; border: 1px solid var(--border-glass); display: flex; flex-direction: column; }
        .product-img { height: 220px; background-size: cover; background-position: center; position: relative; }
        .product-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-surface), transparent); }
        .product-content { padding: 30px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-content h3 { font-size: 22px; margin-bottom: 10px; }
        .product-content p { color: var(--text-muted); font-size: 15px; margin-bottom: 25px; flex-grow: 1; }

        /* === INTERACTIVE CALCULATOR === */
        .calculator-wrapper { background: linear-gradient(145deg, var(--bg-surface), var(--bg-dark)); border: 1px solid var(--accent-cyan); border-radius: 24px; padding: 50px; box-shadow: 0 0 40px rgba(2, 132, 199, 0.1); }
        .calc-input-group { margin-bottom: 30px; }
        .calc-input-group label { display: block; color: var(--accent-cyan); font-weight: 700; font-size: 13px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .calc-input { width: 100%; background: rgba(0,0,0,0.3); border: 2px solid var(--border-glass); border-radius: 12px; padding: 18px 24px; color: #FFF; font-size: 24px; font-weight: 600; outline: none; transition: border-color 0.3s; font-family: 'Space Grotesk', sans-serif; }
        .calc-input:focus { border-color: var(--accent-cyan); }
        .calc-result-box { background: rgba(16, 185, 129, 0.1); border: 2px dashed var(--accent-green); border-radius: 16px; padding: 30px; text-align: center; }
        .calc-result-box h4 { color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .calc-result-value { font-family: 'Space Grotesk', sans-serif; font-size: clamp(36px, 5vw, 54px); font-weight: 800; color: var(--accent-green); line-height: 1; }

        /* === CUSTOMS MAP GRID === */
        .customs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .port-card { background: var(--bg-surface); border: 1px solid var(--border-glass); padding: 25px; border-radius: 12px; cursor: pointer; transition: all 0.3s; }
        .port-card:hover { background: var(--bg-surface-light); border-color: var(--accent-cyan); transform: scale(1.02); }
        .port-card h4 { font-size: 18px; color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .port-card p { font-size: 13px; color: var(--text-muted); }

        /* === MODALS (POP-UPS) === */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px); z-index: 10000; opacity: 0; visibility: hidden; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--bg-surface); width: 100%; max-width: 600px; border-radius: 20px; border: 1px solid var(--border-glass); padding: 40px; position: relative; transform: translateY(30px) scale(0.95); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
        .modal-close { position: absolute; top: 25px; right: 25px; background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; transition: color 0.3s; }
        .modal-close:hover { color: #FFF; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-control { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); padding: 14px 16px; border-radius: 8px; color: #FFF; font-family: inherit; font-size: 15px; outline: none; }
        .form-control:focus { border-color: var(--primary); }

        /* === FLOATING WHATSAPP === */
        .wa-float { position: fixed; bottom: 30px; right: 30px; background: #25D366; color: #FFF; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 10px 30px rgba(37,211,102,0.5); z-index: 9900; transition: transform 0.3s; cursor: pointer; text-decoration: none; }
        .wa-float:hover { transform: scale(1.1) rotate(5deg); }
        .wa-float::before { content: ''; position: absolute; width: 100%; height: 100%; background: inherit; border-radius: inherit; z-index: -1; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.5); opacity: 0; } }

        /* === FOOTER === */
        footer { background: #02040A; padding: 80px 5% 40px; border-top: 1px solid var(--border-glass); }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 50px; margin-bottom: 50px; }
        @media (max-width: 850px) { .footer-grid { grid-template-columns: 1fr; } }
        .footer-brand h3 { font-size: 24px; color: #FFF; margin-bottom: 20px; }
        .footer-links h4 { color: #FFF; margin-bottom: 20px; font-size: 16px; }
        .footer-links p, .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; margin-bottom: 12px; display: block; transition: color 0.3s; }
        .footer-links a:hover { color: var(--accent-cyan); }
        .footer-bottom { text-align: center; border-top: 1px solid var(--border-glass); padding-top: 30px; color: var(--text-muted); font-size: 13px; }

        /* Animations */
        .fade-in { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- HEADER / NAV -->
    <header id="header">
        <a href="#" class="logo js-scroll">DAYA <span>GROUP</span></a>
        <nav class="nav-links" id="navLinks">
            <a href="#about" class="js-scroll">About Us</a>
            <a href="#services" class="js-scroll">Core Services</a>
            <a href="#industries" class="js-scroll">Sourcing</a>
            <a href="#customs" class="js-scroll">Customs Network</a>
            <a href="#calculator" class="js-scroll">ROI Calculator</a>
        </nav>
        <button class="btn btn-primary
